<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Builder</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./main.js" type="module" defer></script>
  </head>
  <body>
    <div id="app">
      <div id="workspace">
        <div id="toolbar">
          <div class="group">
            <button type="button" id="btn-add">Add Block</button>
            <button type="button" id="btn-dup">Duplicate</button>
            <button type="button" id="btn-delete" class="danger">Delete</button>
          </div>
          <div class="sep"></div>
          <div class="group">
            <button type="button" class="tool active" id="tool-move" data-mode="move">
              Move (1)
            </button>
            <button type="button" class="tool" id="tool-scale" data-mode="scale">
              Scale (2)
            </button>
          </div>
          <div class="sep"></div>
          <div class="group">
            <span class="muted">Snap 0.1</span>
            <button type="button" id="btn-save">Save JSON</button>
            <button type="button" id="btn-load">Load JSON</button>
            <input id="file-load" type="file" accept="application/json,.json" hidden />
            <button type="button" id="btn-copy">Copy C++</button>
          </div>
          <div class="hint">
            LMB select · RMB look · MMB orbit · Shift+MMB pan · WASD fly · Q/E up-down · F frame
          </div>
        </div>
        <div id="viewport"></div>
      </div>
      <aside id="sidebar">
        <div id="sidebar-resize"></div>
        <section class="panel" id="outliner">
          <div class="panel-tab">Object Browser</div>
          <ul id="object-list"></ul>
        </section>
        <div id="panel-split"></div>
        <section class="panel" id="properties">
          <div class="panel-tab">Properties</div>
          <div id="properties-body">
            <div id="empty-props">No object selected.</div>
            <form id="props-form" class="hidden">
              <div class="field">
                <label for="prop-name">Name</label>
                <input id="prop-name" type="text" autocomplete="off" />
              </div>
              <div class="field">
                <label>Position</label>
                <div class="vec3">
                  <span class="axis x">X</span>
                  <input id="prop-px" type="number" step="0.1" />
                  <span class="axis y">Y</span>
                  <input id="prop-py" type="number" step="0.1" />
                  <span class="axis z">Z</span>
                  <input id="prop-pz" type="number" step="0.1" />
                </div>
              </div>
              <div class="field">
                <label>Scale</label>
                <div class="vec3">
                  <span class="axis x">X</span>
                  <input id="prop-sx" type="number" step="0.1" min="0.1" />
                  <span class="axis y">Y</span>
                  <input id="prop-sy" type="number" step="0.1" min="0.1" />
                  <span class="axis z">Z</span>
                  <input id="prop-sz" type="number" step="0.1" min="0.1" />
                </div>
              </div>
              <div class="field">
                <label>Color</label>
                <div class="color-row">
                  <input id="prop-color" type="color" />
                  <span class="muted" id="prop-color-label"></span>
                </div>
              </div>
              <div class="field">
                <label>Wire Color</label>
                <div class="color-row">
                  <input id="prop-wire" type="color" />
                  <span class="muted" id="prop-wire-label"></span>
                </div>
              </div>
              <div class="field">
                <label>Export</label>
                <textarea id="export-box" readonly></textarea>
              </div>
            </form>
          </div>
        </section>
      </aside>
    </div>
  </body>
</html>
